<style>
  :root{
    --bg:#03100c;
    --surface:#0d2a20;
    --surface-alt:#123625;
    --line:#25493a;
    --text:#f5f2e8;
    --muted:#8fab9e;
    --gold:#f0c05a;
    --gold-deep:#c99a2e;
    --red:#c0463b;
    --blue:#4fa3c7;
    --green-win:#4caf6e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    background-image:
      radial-gradient(ellipse at top, rgba(240,192,90,0.08), transparent 60%),
      radial-gradient(ellipse at 80% 30%, rgba(79,163,199,0.06), transparent 55%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    min-height:100vh;
    padding-bottom:60px;
  }
  .jumbotron{
    padding:34px 20px 22px;
    text-align:center;
    position:relative;
    border-bottom:2px solid var(--gold);
    background:linear-gradient(180deg, rgba(240,192,90,0.10), transparent);
  }
  .crest{
    width:48px; height:48px; margin:0 auto 10px;
    border:2px solid var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.4rem;
    background:radial-gradient(circle, rgba(240,192,90,0.15), transparent 70%);
    box-shadow:0 0 18px rgba(240,192,90,0.3);
  }
  .jumbotron h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2rem,7vw,3.4rem);
    letter-spacing:3px; margin:4px 0 0;
    background:linear-gradient(180deg, #fbe4a8, var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 10px rgba(240,192,90,0.35));
  }
  .jumbotron .edition{
    font-family:'Bebas Neue',sans-serif; letter-spacing:5px;
    font-size:1rem; color:var(--text); opacity:0.85;
  }
  .jumbotron p{ color:var(--muted); margin:8px 0 0; font-size:0.88rem; }
  .updated{ font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--muted); margin-top:10px; }
  .admin-btn{
    position:absolute; top:18px; right:14px;
    background:var(--surface-alt); border:1px solid var(--line);
    color:var(--muted); border-radius:20px;
    padding:6px 13px; font-size:0.72rem; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .admin-btn.on{ color:var(--gold); border-color:var(--gold); }
  .profile-btn{
    position:absolute; top:18px; left:14px;
    background:linear-gradient(135deg,#fbe4a8,var(--gold)); border:none;
    color:#08201a; font-weight:700; border-radius:20px;
    padding:6px 13px; font-size:0.75rem; cursor:pointer; font-family:'Inter',sans-serif;
  }
  nav{ display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:16px 10px; max-width:950px; margin:0 auto; }
  nav button{
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    padding:8px 14px; border-radius:8px; font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px; font-size:0.98rem; cursor:pointer; transition:all .15s;
  }
  nav button.active{ background:var(--gold); color:#08201a; border-color:var(--gold); }
  main{ max-width:950px; margin:0 auto; padding:0 14px; }
  .card{
    background:linear-gradient(135deg, rgba(240,192,90,0.04), rgba(255,255,255,0.015));
    border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px;
  }
  .card h2{
    font-family:'Bebas Neue',sans-serif; letter-spacing:2px; color:var(--gold);
    font-size:1.4rem; margin:0 0 12px; border-bottom:1px solid var(--line); padding-bottom:8px;
  }
  table{ width:100%; border-collapse:collapse; font-size:0.82rem; }
  th,td{ text-align:center; padding:8px 4px; border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:600; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.5px; }
  td.team-name, th.team-name{ text-align:left; font-weight:600; }
  .efoot-id{ font-size:0.68rem; color:var(--gold); font-family:'Space Mono',monospace; display:inline-block; margin-left:4px; }
  tr.direct-q td.team-name{ color:var(--gold); font-weight:700; }
  tr.direct-q td.team-name::after{ content:" 🟢"; font-size:0.7rem; }
  tr.playoff-q td.team-name{ color:var(--blue); }
  tr.playoff-q td.team-name::after{ content:" 🔵"; font-size:0.7rem; }
  tr.eliminated td.team-name{ color:var(--red); opacity:0.7; }
  tr.eliminated td.team-name::after{ content:" 🔴"; font-size:0.7rem; }
  .mono{ font-family:'Space Mono',monospace; }
  .match-row{
    display:flex; align-items:center; gap:8px; padding:10px 6px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .match-time{
    font-family:'Space Mono',monospace; font-size:0.68rem; color:var(--gold);
    background:rgba(240,192,90,0.1); padding:3px 7px; border-radius:4px; border:1px solid rgba(240,192,90,0.2);
  }
  .match-row .teams{ flex:1; min-width:160px; font-weight:600; }
  .stat-inputs{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .stat-line{ display:flex; align-items:center; gap:6px; font-size:0.75rem; color:var(--muted); }
  .score-input{
    width:38px; background:var(--bg); border:1px solid var(--line);
    color:var(--text); text-align:center; border-radius:5px; padding:4px;
    font-family:'Space Mono',monospace; font-weight:700;
  }
  .score-display{
    font-family:'Space Mono',monospace; font-weight:700; color:var(--gold);
    text-align:center; font-size:0.95rem;
  }
  .save-btn{
    background:var(--blue); border:none; color:#08201a; font-weight:700;
    border-radius:6px; padding:6px 12px; cursor:pointer; font-size:0.75rem;
  }
  .img-btn{
    background:var(--surface-alt); border:1px solid var(--line); color:var(--gold);
    border-radius:6px; padding:4px 8px; font-size:0.7rem; cursor:pointer; font-weight:600;
  }
  .proof-link{
    color:var(--gold); font-size:0.72rem; text-decoration:underline; cursor:pointer; margin-left:6px;
  }
  .tie-card{
    border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;
    background:var(--surface-alt); position:relative;
  }
  .tie-card h4{
    margin:0 0 8px; font-family:'Bebas Neue',sans-serif; letter-spacing:1px;
    color:var(--text); font-size:1.1rem;
  }
  .leg-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .leg-label{ width:105px; font-size:0.72rem; color:var(--muted); }
  .agg{ font-family:'Space Mono',monospace; color:var(--gold); font-weight:700; margin-top:6px; }
  .winner-pill{
    display:inline-block; margin-top:8px; background:var(--green-win); color:#08201a;
    font-weight:700; padding:4px 12px; border-radius:20px; font-size:0.8rem;
  }
  .manual-btns button{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:5px 10px; border-radius:6px; margin-right:6px; cursor:pointer; font-size:0.8rem;
  }
  .rules-box{ font-size:0.88rem; line-height:1.65; color:var(--muted); }
  .rules-box b{ color:var(--text); }
  .gen-btn{
    background:linear-gradient(135deg,#fbe4a8,var(--gold)); border:none; color:#08201a; font-weight:700;
    padding:11px 16px; border-radius:8px; cursor:pointer; font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px; font-size:1rem; margin-bottom:14px; margin-right:8px;
  }
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex;
    align-items:center; justify-content:center; z-index:100; padding:15px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--gold); border-radius:12px;
    padding:20px; width:100%; max-width:440px; text-align:center; max-height:90vh; overflow-y:auto;
  }
  .modal img{ max-width:100%; height:auto; border-radius:8px; border:1px solid var(--line); margin-top:10px; }
  .modal input, .modal select{
    width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
  }
  .modal button{
    padding:10px 18px; border-radius:6px; border:none; cursor:pointer;
    background:var(--gold); color:#08201a; font-weight:700; margin-top:10px; width:100%;
  }
  .modal .err{ color:var(--red); font-size:0.8rem; margin-top:4px; }
  .empty-hint{ color:var(--muted); font-size:0.85rem; font-style:italic; }
  .palmares-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
  .laurel-card{
    display:flex; align-items:center; gap:14px; padding:16px;
    background:linear-gradient(135deg, rgba(240,192,90,0.09), rgba(255,255,255,0.02));
    border:1px solid rgba(240,192,90,0.3); border-radius:14px;
  }
  .laurel-icon{ font-size:2.2rem; flex-shrink:0; width:48px; text-align:center; }
  .laurel-title{ font-family:'Bebas Neue',sans-serif; letter-spacing:1.5px; color:var(--gold); font-size:0.95rem; }
  .laurel-name{ font-family:'Bebas Neue',sans-serif; font-size:1.4rem; color:var(--text); letter-spacing:0.5px; }
  .laurel-sub{ font-family:'Space Mono',monospace; font-size:0.72rem; color:var(--muted); margin-top:2px; }
  .lb-table td, .lb-table th{ text-align:left; }
  .lb-table td:last-child, .lb-table th:last-child{ text-align:center; }
  .tos-box{
    text-align:left; font-size:0.78rem; color:var(--muted); background:var(--bg);
    padding:10px; border-radius:6px; border:1px solid var(--line); margin:10px 0;
  }
</style>
</head>
