<script>
// --- CONFIGURATION FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyCeRIKQGpod0kDg3uyEr7biJVVWOBxwKEI",
  authDomain: "efootball-cup-ff438.firebaseapp.com",
  databaseURL: "https://efootball-cup-ff438-default-rtdb.firebaseio.com",
  projectId: "efootball-cup-ff438",
  storageBucket: "efootball-cup-ff438.firebasestorage.app",
  messagingSenderId: "497542677221",
  appId: "1:497542677221:web:82b760b8e3cc3f0ca54a0c"
};

let db = null;
try {
  if (typeof firebase !== 'undefined') {
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    db = firebase.database();
  }
} catch(e) { console.warn("Firebase non disponible", e); }

const ADMIN_PASSWORD = 'edition2026';
const PARTICIPANTS = ["Florian","Elvis","Uriel","Zann","Fareth","Amen","Bonaventure","Salim","Ponce","Franck","Baki","Fleuris","Feid","Michael","Espoir"];

let state = null;
let isAdmin = false;
let currentTab = 'ligue';
let selectedAgendaPlayer = PARTICIPANTS[0];

function emptyStat(){ return {hg:null, ag:null, img:null}; }

function getMatchScheduleInfo(index){
  const startDate = new Date(2026, 7, 16);
  const dayOffset = Math.floor(index / 4);
  const slots = ["20h00", "20h30", "21h00", "21h30"];
  const slot = slots[index % 4];

  const mDate = new Date(startDate);
  mDate.setDate(startDate.getDate() + dayOffset);

  const daysFr = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
  const monthsFr = ["Août", "Septembre"];
  
  const dName = daysFr[mDate.getDay()];
  const dNum = mDate.getDate();
  const mName = monthsFr[mDate.getMonth() === 7 ? 0 : 1];

  return {
    dateLabel: `${dName} ${dNum} ${mName}`,
    timeLabel: slot,
    dayNum: dayOffset + 1
  };
}

function generate15PlayerLeagueMatches(){
  const players = PARTICIPANTS.slice();
  const N = players.length;
  const offsets = [1, 2, 3, 4];
  const matches = [];
  let matchId = 0;

  for (let i = 0; i < N; i++) {
    for (let offset of offsets) {
      let j = (i + offset) % N;
      const home = players[i];
      const away = players[j];
      const roundNum = Math.min(8, Math.floor(matchId / 7.5) + 1);
      const sched = getMatchScheduleInfo(matchId);

      matches.push({
        id: 'L15-' + matchId,
        index: matchId,
        round: roundNum,
        home,
        away,
        dateLabel: sched.dateLabel,
        timeLabel: sched.timeLabel,
        hg: null,
        ag: null,
        img: null
      });
      matchId++;
    }
  }
  return matches;
}

function generateInitialState(){
  return {
    matches: generate15PlayerLeagueMatches(),
    playerProfiles: {},
    knockout: { barrages:null, qf:null, sf:null, final:null, thirdPlace:null },
    updatedAt: new Date().toISOString()
  };
}

function sanitizeState(s){
  if(!s || typeof s !== 'object') s = generateInitialState();
  
  if (s.matches && !Array.isArray(s.matches) && typeof s.matches === 'object') {
    s.matches = Object.values(s.matches);
  }
  if(!s.matches || !Array.isArray(s.matches) || s.matches.length === 0) {
    s.matches = generate15PlayerLeagueMatches();
  }

  if(!s.playerProfiles || typeof s.playerProfiles !== 'object') s.playerProfiles = {};
  
  if(!s.knockout || typeof s.knockout !== 'object') {
    s.knockout = { barrages:null, qf:null, sf:null, final:null, thirdPlace:null };
  } else {
    ['barrages', 'qf', 'sf'].forEach(k => {
      if(s.knockout[k] && !Array.isArray(s.knockout[k]) && typeof s.knockout[k] === 'object') {
        s.knockout[k] = Object.values(s.knockout[k]);
      }
    });
  }

  return s;
}

async function saveState(s){
  s.updatedAt = new Date().toISOString();
  try {
    localStorage.setItem('efoot_backup_v15_final', JSON.stringify(s));
  } catch(e){}
  if (db) {
    try {
      await db.ref('efoot_holydays_state_v15_final').set(s);
    } catch(e){ console.error('Erreur Firebase save', e); }
  }
}

function computeLeagueStandings(){
  state = sanitizeState(state);
  const table = {};
  PARTICIPANTS.forEach(t=> table[t] = {team:t, pts:0, j:0, v:0, n:0, d:0, bp:0, bc:0, diff:0, cs:0});
  
  (state.matches || []).forEach(m=>{
    if (m && m.hg!==null && m.ag!==null && m.hg!=='' && m.ag!=='') {
      const H = table[m.home], A = table[m.away];
      if (H && A) {
        const hg = parseInt(m.hg)||0, ag = parseInt(m.ag)||0;
        H.j++; A.j++;
        H.bp += hg; H.bc += ag;
        A.bp += ag; A.bc += hg;
        if(ag === 0) H.cs++;
        if(hg === 0) A.cs++;

        if(hg > ag){ H.v++; H.pts+=3; A.d++; }
        else if(hg < ag){ A.v++; A.pts+=3; H.d++; }
        else { H.n++; A.n++; H.pts+=1; A.pts+=1; }
      }
    }
  });

  Object.values(table).forEach(r=> r.diff = r.bp - r.bc);
  
  return Object.values(table).sort((a,b)=>
    b.pts-a.pts || b.diff-a.diff || b.bp-a.bp || b.v-a.v || a.team.localeCompare(b.team)
  );
}

function computeLeaderboards(){
  state = sanitizeState(state);
  const goals = {}, conceded = {}, cleanSheets = {}, matchesPlayed = {};
  PARTICIPANTS.forEach(p=>{ goals[p]=0; conceded[p]=0; cleanSheets[p]=0; matchesPlayed[p]=0; });

  const processMatch = (home, away, hgVal, agVal)=>{
    if(home && away && hgVal!==null && agVal!==null && hgVal!=='' && agVal!==''){
      const hg = parseInt(hgVal)||0, ag = parseInt(agVal)||0;
      goals[home] = (goals[home]||0) + hg;
      goals[away] = (goals[away]||0) + ag;
      conceded[home] = (conceded[home]||0) + ag;
      conceded[away] = (conceded[away]||0) + hg;
      matchesPlayed[home] = (matchesPlayed[home]||0) + 1;
      matchesPlayed[away] = (matchesPlayed[away]||0) + 1;
      if(ag === 0) cleanSheets[home] = (cleanSheets[home]||0) + 1;
      if(hg === 0) cleanSheets[away] = (cleanSheets[away]||0) + 1;
    }
  };

  (state.matches || []).forEach(m=> {
    if(m) processMatch(m.home, m.away, m.hg, m.ag);
  });

  const k = state.knockout || {};
  const processTie = (tie)=>{
    if(!tie) return;
    (tie.legs || []).forEach(l=> processMatch(tie.home, tie.away, l.hg, l.ag));
    if(tie.tiebreak) processMatch(tie.home, tie.away, tie.tiebreak.hg, tie.tiebreak.ag);
  };

  (k.barrages || []).forEach(processTie);
  (k.qf || []).forEach(processTie);
  (k.sf || []).forEach(processTie);
  if(k.final && k.final.match) processMatch(k.final.home, k.final.away, k.final.match.hg, k.final.match.ag);
  if(k.thirdPlace && k.thirdPlace.match) processMatch(k.thirdPlace.home, k.thirdPlace.away, k.thirdPlace.match.hg, k.thirdPlace.match.ag);

  const goalsArr = Object.entries(goals).map(([team,val])=>({team,val, avg:(matchesPlayed[team]? (val/matchesPlayed[team]).toFixed(2): 0)})).sort((a,b)=>b.val-a.val || a.team.localeCompare(b.team));
  const concededArr = Object.entries(conceded).map(([team,val])=>({team,val})).sort((a,b)=>a.val-b.val || a.team.localeCompare(b.team));
  const cleanSheetsArr = Object.entries(cleanSheets).map(([team,val])=>({team,val})).sort((a,b)=>b.val-a.val || a.team.localeCompare(b.team));

  return {goalsArr, concededArr, cleanSheetsArr};
}

function generateBarrages(){
  const s = computeLeagueStandings();
  const makeTie = (id, home, away)=>({
    id, round:'BAR', home, away, legs:[emptyStat(),emptyStat()], tiebreak:emptyStat(), manualWinner:null, winner:null
  });

  state.knockout.barrages = [
    makeTie('bar1', s[4].team, s[11].team),
    makeTie('bar2', s[5].team, s[10].team),
    makeTie('bar3', s[6].team, s[9].team),
    makeTie('bar4', s[7].team, s[8].team)
  ];
  state.knockout.qf = null;
  state.knockout.sf = null;
  state.knockout.final = null;
  state.knockout.thirdPlace = null;
}

function generateQF(){
  const s = computeLeagueStandings();
  const b = state.knockout.barrages || [];
  
  const makeTie = (id, home, away)=>({
    id, round:'QF', home, away, legs:[emptyStat(),emptyStat()], tiebreak:emptyStat(), manualWinner:null, winner:null
  });

  state.knockout.qf = [
    makeTie('qf1', s[0].team, (b[3]? b[3].winner : '?')),
    makeTie('qf2', s[1].team, (b[2]? b[2].winner : '?')),
    makeTie('qf3', s[2].team, (b[1]? b[1].winner : '?')),
    makeTie('qf4', s[3].team, (b[0]? b[0].winner : '?'))
  ];
  state.knockout.sf = null;
  state.knockout.final = null;
  state.knockout.thirdPlace = null;
}

function generateSF(){
  const qf = state.knockout.qf;
  if(!qf) return;
  const makeTie = (id,home,away)=>({id, round:'SF', home, away, legs:[emptyStat(),emptyStat()], tiebreak:emptyStat(), manualWinner:null, winner:null});
  state.knockout.sf = [
    makeTie('sf1', qf[0].winner, qf[3].winner),
    makeTie('sf2', qf[1].winner, qf[2].winner)
  ];
  state.knockout.final = null;
  state.knockout.thirdPlace = null;
}

function generateFinals(){
  const sf = state.knockout.sf;
  if(!sf) return;
  const sf1Loser = sf[0].winner===sf[0].home ? sf[0].away : sf[0].home;
  const sf2Loser = sf[1].winner===sf[1].home ? sf[1].away : sf[1].home;
  state.knockout.final = {id:'final', round:'F', home:sf[0].winner, away:sf[1].winner, match:emptyStat(), manualWinner:null, winner:null};
  state.knockout.thirdPlace = {id:'3rd', round:'3P', home:sf1Loser, away:sf2Loser, match:emptyStat(), manualWinner:null, winner:null};
}

function tieAggregate(tie){
  if(!tie || !tie.legs) return null;
  const l1 = tie.legs[0], l2 = tie.legs[1];
  if(!l1 || !l2 || l1.hg===null||l1.ag===null||l2.hg===null||l2.ag===null||l1.hg===''||l1.ag===''||l2.hg===''||l2.ag==='') return null;
  const homeAgg = parseInt(l1.hg) + parseInt(l2.ag);
  const awayAgg = parseInt(l1.ag) + parseInt(l2.hg);
  return {homeAgg, awayAgg};
}

function evaluateTieWinner(tie){
  if(!tie) return;
  if(tie.manualWinner){ tie.winner = tie.manualWinner; return; }
  const agg = tieAggregate(tie);
  if(!agg){ tie.winner = null; return; }
  if(agg.homeAgg > agg.awayAgg){ tie.winner = tie.home; return; }
  if(agg.homeAgg < agg.awayAgg){ tie.winner = tie.away; return; }
  const tb = tie.tiebreak;
  if(tb && tb.hg!==null && tb.ag!==null && tb.hg!=='' && tb.ag!==''){
    if(parseInt(tb.hg) > parseInt(tb.ag)){ tie.winner = tie.home; return; }
    if(parseInt(tb.hg) < parseInt(tb.ag)){ tie.winner = tie.away; return; }
  }
  tie.winner = null;
}

function evaluateSingleMatch(m){
  if(!m) return;
  if(m.manualWinner){ m.winner = m.manualWinner; return; }
  if(!m.match || m.match.hg===null || m.match.ag===null || m.match.hg==='' || m.match.ag===''){ m.winner = null; return; }
  if(parseInt(m.match.hg) > parseInt(m.match.ag)){ m.winner = m.home; return; }
  if(parseInt(m.match.hg) < parseInt(m.match.ag)){ m.winner = m.away; return; }
  m.winner = null;
}

function handleImageUpload(file, callback){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 600;
      let width = img.width;
      let height = img.height;
      if (width > MAX_WIDTH) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getPlayerBadgeHTML(playerName){
  if(!playerName) return '?';
  const prof = (state.playerProfiles || {})[playerName];
  if (prof && prof.username) {
    return `<b>${playerName}</b> <span class="efoot-id">(@${prof.username})</span>`;
  }
  return `<b>${playerName}</b>`;
}

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

  const proofBtn = l.img ? `<span class="proof-link" onclick="openImageModal('${l.img}')">📷 Preuve</span>` : '';

    return `<div class="leg-row">

      <span>-</span>

  }
  return `<div class="leg-row">

    <span class="score-display">${l.hg===null?'–':l.hg} - ${l.ag===null?'–':l.ag} ${proofBtn}</span>
  </div>`;

function tieCard(tie, isSingle){
  if(!tie) return '';
  if(!isSingle) evaluateTieWinner(tie);
  if(isSingle) evaluateSingleMatch(tie);
  let body = '';
  if(isSingle){
    const m = tie.match || emptyStat();
    const proofBtn = m.img ? `<span class="proof-link" onclick="openImageModal('${m.img}')">📷 Preuve</span>` : '';
    body = `<div class="leg-row">
      <span class="leg-label">Score Final</span>
      ${isAdmin ? `
        <input type="number" min="0" class="score-input" data-single="${tie.id}" data-field="hg" value="${m.hg===null?'':m.hg}">
        <span>-</span>
        <input type="number" min="0" class="score-input" data-single="${tie.id}" data-field="ag" value="${m.ag===null?'':m.ag}">
        <label class="img-btn">📷 <input type="file" accept="image/*" style="display:none" data-singleimg="${tie.id}"></label>
        <button class="save-btn" data-savesingle="${tie.id}">OK</button>
        ${proofBtn}
      ` : `<span class="score-display">${m.hg===null?'–':m.hg} - ${m.ag===null?'–':m.ag} ${proofBtn}</span>`}
    </div>`;
    if(m.hg!==null && m.ag!==null && m.hg===m.ag && !tie.winner){
      body += `<div class="empty-hint">Égalité — Désigne le vainqueur des tirs au but :</div>
        <div class="manual-btns">
          ${isAdmin ? `<button data-manual="${tie.id}" data-team="${tie.home}">${tie.home}</button><button data-manual="${tie.id}" data-team="${tie.away}">${tie.away}</button>` : ''}
        </div>`;
    }
  } else {
    const agg = tieAggregate(tie);
    body = legStatRow(tie,0,'Match Aller') + legStatRow(tie,1,'Match Retour');
    body += isAdmin ? `<button class="save-btn" data-savetie="${tie.id}" style="margin-top:6px;">Enregistrer le tour</button>` : '';
    body += agg ? `<div class="agg">Score Cumulé : ${agg.homeAgg} - ${agg.awayAgg}</div>` : '';
    if(agg && agg.homeAgg===agg.awayAgg){
      const tb = tie.tiebreak || emptyStat();
      body += `<div class="leg-row">
        <span class="leg-label">Départage (6 min)</span>
        ${isAdmin ? `
          <input type="number" min="0" class="score-input" data-tb="${tie.id}" data-field="hg" value="${tb.hg===null?'':tb.hg}">
          <span>-</span>
          <input type="number" min="0" class="score-input" data-tb="${tie.id}" data-field="ag" value="${tb.ag===null?'':tb.ag}">
          <button class="save-btn" data-savetb="${tie.id}">OK</button>
        ` : `<span class="score-display">${tb.hg===null?'–':tb.hg} - ${tb.ag===null?'–':tb.ag}</span>`}
      </div>`;
      if(tb.hg!==null && tb.ag!==null && tb.hg===tb.ag && !tie.winner){
        body += `<div class="empty-hint">Égalité persistante — Désigne le vainqueur :</div>
        <div class="manual-btns">
          ${isAdmin ? `<button data-manual="${tie.id}" data-team="${tie.home}">${tie.home}</button><button data-manual="${tie.id}" data-team="${tie.away}">${tie.away}</button>` : ''}
        </div>`;
      }
    }
  }
  return `<div class="tie-card">
    <h4>${getPlayerBadgeHTML(tie.home)} <span style="color:var(--muted)">vs</span> ${getPlayerBadgeHTML(tie.away)}</h4>
    ${body}
    ${tie.winner ? `<div class="winner-pill">🏆 Qualifié : ${tie.winner}</div>` : ''}
  </div>`;
}

function renderFinale(){
  const k = state.knockout || {};
  let html = '';

  if (isAdmin) {
    html += `<div class="card" style="border:1px dashed var(--gold);">
      <h3 style="margin-top:0;color:var(--gold);font-family:'Bebas Neue',sans-serif;">Administration — Phase Finale</h3>
      <button class="gen-btn" id="genBar">⚡ Générer les Barrages (5e-12e)</button>
      <button class="gen-btn" id="genQF">⚡ Générer les Quarts (1er-4e + Vainqueurs Barrages)</button>
      <button class="gen-btn" style="background:var(--red);color:#fff;" onclick="resetLeagueState()">🔄 Réinitialiser la Ligue</button>
    </div>`;
  }

  if(!k.barrages && !k.qf){
    return html + `<div class="card"><h2>Phase Finale</h2><p class="empty-hint">La phase finale sera générée à la fin des 8 journées de Ligue.</p></div>`;
  }

  if(k.barrages){
    html += `<div class="card"><h2 style="margin-top:0">🔵 Barrages de Qualification (Aller-Retour)</h2>${k.barrages.map(t=>tieCard(t,false)).join('')}</div>`;
  }

  if(k.qf){
    html += `<div class="card"><h2 style="margin-top:0">🟢 Quarts de Finale (Aller-Retour)</h2>${k.qf.map(t=>tieCard(t,false)).join('')}</div>`;
    const qfDone = k.qf.every(t=>t.winner);
    if(qfDone && !k.sf && isAdmin){
      html += `<div class="card"><button class="gen-btn" id="genSF">⚡ Générer les Demi-Finales</button></div>`;
    }
  }

  if(k.sf){
    html += `<div class="card"><h2 style="margin-top:0">Demi-Finales (Aller-Retour)</h2>${k.sf.map(t=>tieCard(t,false)).join('')}</div>`;
    const sfDone = k.sf.every(t=>t.winner);
    if(sfDone && !k.final && isAdmin){
      html += `<div class="card"><button class="gen-btn" id="genFinals">⚡ Générer les Finales</button></div>`;
    }
  }

  if(k.final){
    html += `<div class="card"><h2 style="margin-top:0">🥉 Petite Finale (3e Place)</h2>${tieCard(k.thirdPlace,true)}</div>`;
    html += `<div class="card"><h2 style="margin-top:0">🏆 GRANDE FINALE</h2>${tieCard(k.final,true)}</div>`;
  }

  return html;
}

function renderPalmares(){
  const k = state.knockout || {};
  const champion = k.final ? k.final.winner : null;
  const viceChamp = (k.final && champion) ? (champion===k.final.home ? k.final.away : k.final.home) : null;
  const third = k.thirdPlace ? k.thirdPlace.winner : null;
  
  const {goalsArr, concededArr, cleanSheetsArr} = computeLeaderboards();
  const topAttack = (goalsArr && goalsArr.length>0) ? goalsArr[0] : null;
  const topDefense = (concededArr && concededArr.length>0) ? concededArr[0] : null;
  const topClean = (cleanSheetsArr && cleanSheetsArr.length>0) ? cleanSheetsArr[0] : null;

  const laurel = (icon,title,name,sub)=>`
    <div class="laurel-card">
      <div class="laurel-icon">${icon}</div>
      <div>
        <div class="laurel-title">${title}</div>
        <div class="laurel-name">${name ? getPlayerBadgeHTML(name) : 'En attente'}</div>
        ${sub ? `<div class="laurel-sub">${sub}</div>` : ''}
      </div>
    </div>`;

  return `<div class="card">
    <h2>Palmarès Officiel</h2>
    <div class="palmares-grid">
      ${laurel('🏆','CHAMPION DU TOURNOI', champion)}
      ${laurel('🥈','VICE-CHAMPION', viceChamp)}
      ${laurel('🥉','3E PLACE PODIUM', third)}
      ${laurel('⚽','MEILLEURE ATTAQUE', topAttack && topAttack.val>0 ? topAttack.team : null, topAttack && topAttack.val>0 ? topAttack.val + ' Buts Marqués' : null)}
      ${laurel('🛡️','MEILLEURE DÉFENSE', topDefense ? topDefense.team : null, topDefense ? topDefense.val + ' Buts Encaissés' : null)}
      ${laurel('🧱','LE MUR DE FER (Clean Sheets)', topClean && topClean.val>0 ? topClean.team : null, topClean && topClean.val>0 ? topClean.val + ' Matchs sans encaisser' : null)}
    </div>
  </div>
  <div class="card">
    <h2>Classement des Attaques (Buts Marqués)</h2>
    <table class="lb-table"><thead><tr><th>Joueur</th><th>Moyenne / Match</th><th>Total Buts</th></tr></thead>
    <tbody>${(goalsArr||[]).map(r=>`<tr><td>${getPlayerBadgeHTML(r.team)}</td><td>${r.avg} B/M</td><td class="mono">${r.val}</td></tr>`).join('')}</tbody></table>
  </div>
  <div class="card">
    <h2>Classement des Défenses (Buts Encaissés)</h2>
    <table class="lb-table"><thead><tr><th>Joueur</th><th>Buts Encaissés</th></tr></thead>
    <tbody>${(concededArr||[]).map(r=>`<tr><td>${getPlayerBadgeHTML(r.team)}</td><td class="mono">${r.val}</td></tr>`).join('')}</tbody></table>
  </div>`;
}

    if(!pName){ document.getElementById('profErr').textContent = "Veuillez choisir votre prénom."; return; }
    if(!efUser){ document.getElementById('profErr').textContent = "Veuillez entrer votre nom d'utilisateur eFootball."; return; }
    if(!tosAgreed){ document.getElementById('profErr').textContent = "Vous devez accepter la charte d'engagement."; return; }

    if(!state.playerProfiles) state.playerProfiles = {};
    state.playerProfiles[pName] = {
      username: efUser,
      agreed: true
    };

    await saveState(state);
    root.innerHTML = '';
    render();
  };
}

function openAdminModal(){
  if(isAdmin){ isAdmin=false; render(); return; }
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="modalBg">
    <div class="modal">
      <h3 style="margin-top:0;color:var(--gold);font-family:'Bebas Neue';letter-spacing:1px;">Accès Administrateur</h3>
      <input type="password" id="pwdInput" placeholder="Mot de passe">
      <div class="err" id="pwdErr"></div>
      <button id="pwdSubmit">Entrer</button>
    </div>
  </div>`;
  document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') root.innerHTML=''; };
  document.getElementById('pwdSubmit').onclick = ()=>{
    const val = document.getElementById('pwdInput').value;
    if(val === ADMIN_PASSWORD){ isAdmin = true; root.innerHTML=''; render(); }
    else { document.getElementById('pwdErr').textContent = 'Mot de passe incorrect.'; }
  };
}

// ---------- ATTACH HANDLERS SÉCURISÉS ----------

function readNum(el){ return (!el || el.value === '') ? null : parseInt(el.value); }

function attachHandlers(){
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.onclick = openProfileModal;

  const adminBtn = document.getElementById('adminBtn');
  if(adminBtn) adminBtn.onclick = openAdminModal;

  const agendaSelect = document.getElementById('agendaSelect');
  if (agendaSelect) {
    agendaSelect.onchange = (e) => {
      selectedAgendaPlayer = e.target.value;
      render();
    };
  }

  document.querySelectorAll('[data-gsave]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-gsave');
      const m = (state.matches||[]).find(m=>m.id===id);
      if(m){
        ['hg','ag'].forEach(f=>{
          const el = document.querySelector(`[data-gmid="${id}"][data-gfield="${f}"]`);
          m[f] = readNum(el);
        });
        await saveState(state);
      }
    };
  });

  document.querySelectorAll('[data-gimg]').forEach(input=>{
    input.onchange = (e)=>{
      const id = input.getAttribute('data-gimg');
      const m = (state.matches||[]).find(m=>m.id===id);
      if(m && e.target.files[0]){
        handleImageUpload(e.target.files[0], async (base64Img)=>{
          m.img = base64Img;
          await saveState(state);
        });
      }
    };
  });

  document.querySelectorAll('[data-savetie]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-savetie');
      const tie = findTie(id);
      if(tie){
        [0,1].forEach(idx=>{
          ['hg','ag'].forEach(f=>{
            const el = document.querySelector(`[data-leg="${id}"][data-legidx="${idx}"][data-field="${f}"]`);
            if(!tie.legs) tie.legs = [emptyStat(), emptyStat()];
            if(!tie.legs[idx]) tie.legs[idx] = emptyStat();
            tie.legs[idx][f] = readNum(el);
          });
        });
        evaluateTieWinner(tie);
        await saveState(state);
      }
    };
  });

  document.querySelectorAll('[data-legimg]').forEach(input=>{
    input.onchange = (e)=>{
      const id = input.getAttribute('data-legimg');
      const idx = parseInt(input.getAttribute('data-legidx'));
      const tie = findTie(id);
      if(tie && tie.legs[idx] && e.target.files[0]){
        handleImageUpload(e.target.files[0], async (base64Img)=>{
          tie.legs[idx].img = base64Img;
          await saveState(state);
        });
      }
    };
  });

  document.querySelectorAll('[data-savetb]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-savetb');
      const tie = findTie(id);
      if(tie){
        ['hg','ag'].forEach(f=>{
          const el = document.querySelector(`[data-tb="${id}"][data-field="${f}"]`);
          if(!tie.tiebreak) tie.tiebreak = emptyStat();
          tie.tiebreak[f] = readNum(el);
        });
        evaluateTieWinner(tie);
        await saveState(state);
      }
    };
  });

  document.querySelectorAll('[data-savesingle]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-savesingle');
      const m = findSingle(id);
      if(m){
        ['hg','ag'].forEach(f=>{
          const el = document.querySelector(`[data-single="${id}"][data-field="${f}"]`);
          if(!m.match) m.match = emptyStat();
          m.match[f] = readNum(el);
        });
        evaluateSingleMatch(m);
        await saveState(state);
      }
    };
  });

  document.querySelectorAll('[data-singleimg]').forEach(input=>{
    input.onchange = (e)=>{
      const id = input.getAttribute('data-singleimg');
      const m = findSingle(id);
      if(m && e.target.files[0]){
        handleImageUpload(e.target.files[0], async (base64Img)=>{
          if(!m.match) m.match = emptyStat();
          m.match.img = base64Img;
          await saveState(state);
        });
      }
    };
  });

  document.querySelectorAll('[data-manual]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute('data-manual');
      const team = btn.getAttribute('data-team');
      let tie = findTie(id) || findSingle(id);
      if(tie){
        tie.manualWinner = team;
        tie.winner = team;
        await saveState(state);
      }
    };
  });

  const genBar = document.getElementById('genBar');
  if(genBar) genBar.onclick = async ()=>{ generateBarrages(); await saveState(state); };
  const genQF = document.getElementById('genQF');
  if(genQF) genQF.onclick = async ()=>{ generateQF(); await saveState(state); };
  const genSF = document.getElementById('genSF');
  if(genSF) genSF.onclick = async ()=>{ generateSF(); await saveState(state); };
  const genFinals = document.getElementById('genFinals');
  if(genFinals) genFinals.onclick = async ()=>{ generateFinals(); await saveState(state); };
}

function findTie(id){
  const k = state.knockout || {};
  if(k.barrages){ const t = k.barrages.find(t=>t.id===id); if(t) return t; }
  if(k.qf){ const t = k.qf.find(t=>t.id===id); if(t) return t; }
  if(k.sf){ const t = k.sf.find(t=>t.id===id); if(t) return t; }
  return null;
}

function findSingle(id){
  const k = state.knockout || {};
  if(k.final && k.final.id===id) return k.final;
  if(k.thirdPlace && k.thirdPlace.id===id) return k.thirdPlace;
  return null;
}

// ---------- NAVIGATION ----------

const nav = document.getElementById('nav');
if(nav){
  nav.onclick = (e)=>{
    if(e.target.tagName==='BUTTON'){
      currentTab = e.target.getAttribute('data-tab');
      document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
      e.target.classList.add('active');
      render();
    }
  };
}

// ---------- INITIALISATION SECOURUE ----------

function initSync(){
  try {
    const backup = localStorage.getItem('efoot_backup_v15_final');
    if (backup) { state = sanitizeState(JSON.parse(backup)); }
  } catch(e){}

  if(!state) state = generateInitialState();
  render();

  if (db) {
    db.ref('efoot_holydays_state_v15_final').on('value', async (snapshot) => {
      const val = snapshot.val();
      if (val) {
        state = sanitizeState(val);
      } else {
        state = generateInitialState();
        await saveState(state);
      }
      render();
    });
  }
}

// Lancement sécurisé une fois le document chargé
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initSync);
} else {
  initSync();
}
</script>
