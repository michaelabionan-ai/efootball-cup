  .palmares-grid{ display:grid; grid-template-columns:1fr; gap:12px; }
  .laurel-card{

    background:linear-gradient(135deg, rgba(240,192,90,0.09), rgba(255,255,255,0.02));

  }
  .laurel-icon{ font-size:2rem; flex-shrink:0; width:48px; text-align:center; }
  .laurel-title{ font-family:'Bebas Neue',sans-serif; letter-spacing:1.5px; color:var(--gold); font-size:0.95rem; }

<script>
// --- VOS CLÉS FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyCeRIKQGpod0kDg3uyEr7biJVVWOBxwKEI",
  authDomain: "efootball-cup-ff438.firebaseapp.com",
  databaseURL: "https://efootball-cup-ff438-default-rtdb.firebaseio.com",
  projectId: "efootball-cup-ff438",
  storageBucket: "efootball-cup-ff438.firebasestorage.app",
  messagingSenderId: "497542677221",
  appId: "1:497542677221:web:82b760b8e3cc3f0ca54a0c"
};

if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
const db = firebase.database();

const ADMIN_PASSWORD = 'edition2026';
const PARTICIPANTS = ["Florian","Elvis","Uriel","Zann","Fareth","Amen","Bonaventure","Salim","Ponce","Franck","Baki","Fleuris","Feid","Hermann","Michael"];
const GROUP_SIZES = {A:4, B:4, C:4, D:3};
const GROUP_COLOR = {A:'var(--A)', B:'var(--B)', C:'var(--C)', D:'var(--D)'};

let state = null;
let isAdmin = false;
let currentTab = 'groupes';

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function emptyStat(){ return {hg:null, ag:null}; }

function generateGroupMatches(teams, groupKey){
  const matches = [];
  let idc = 0;
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      matches.push({id: groupKey+'-'+(idc++), group:groupKey, home:teams[i], away:teams[j], hg:null, ag:null});
      matches.push({id: groupKey+'-'+(idc++), group:groupKey, home:teams[j], away:teams[i], hg:null, ag:null});
    }
  }
  return shuffle(matches).map((m,i)=>({...m, order:i+1}));
}

function generateInitialState(){
  const shuffled = shuffle(PARTICIPANTS);
  const groups = {};
  let cursor = 0;
  ['A','B','C','D'].forEach(k=>{
    groups[k] = shuffled.slice(cursor, cursor+GROUP_SIZES[k]);
    cursor += GROUP_SIZES[k];
  });
  const matches = [];
  ['A','B','C','D'].forEach(k=> matches.push(...generateGroupMatches(groups[k], k)));
  return {
    groups,
    matches,
    knockout:{ qf:null, sf:null, final:null, thirdPlace:null },
    updatedAt: new Date().toISOString()
  };
}

async function saveState(s){
  s.updatedAt = new Date().toISOString();
  try{
    await db.ref('efoot_state').set(s);
  }catch(e){ console.error('Erreur sauvegarde', e); alert("Erreur d'enregistrement."); }
}

function computeStandings(groupKey){
  if (!state || !state.groups || !state.groups[groupKey]) return [];
  const teams = state.groups[groupKey];
  const table = {};
  teams.forEach(t=> table[t] = {team:t, pts:0, j:0, v:0, n:0, d:0, bp:0, bc:0, diff:0});
  
  (state.matches || []).filter(m=>m.group===groupKey && m.hg!==null && m.ag!==null && m.hg!=='' && m.ag!=='').forEach(m=>{
    const H = table[m.home], A = table[m.away];
    if (H && A) {
      const hg = parseInt(m.hg)||0, ag = parseInt(m.ag)||0;
      H.j++; A.j++;
      H.bp += hg; H.bc += ag;
      A.bp += ag; A.bc += hg;
      if(hg > ag){ H.v++; H.pts+=3; A.d++; }
      else if(hg < ag){ A.v++; A.pts+=3; H.d++; }
      else { H.n++; A.n++; H.pts++; A.pts++; }
    }
  });
  Object.values(table).forEach(r=> r.diff = r.bp - r.bc);
  return Object.values(table).sort((a,b)=>
    b.pts-a.pts || b.diff-a.diff || b.bp-a.bp || a.bc-b.bc || b.v-a.v || a.team.localeCompare(b.team)
  );
}

function allGroupMatchesPlayed(){
  if (!state || !state.matches) return false;
  return state.matches.every(m=>m.hg!==null && m.ag!==null && m.hg!=='' && m.ag!=='');
}

function computeLeaderboards(){
  const goals = {}, conceded = {};
  PARTICIPANTS.forEach(p=>{ goals[p]=0; conceded[p]=0; });
  if (!state) return {goalsArr: [], concededArr: []};

  if (state.matches && Array.isArray(state.matches)) {
    state.matches.forEach(m=>{
      if(m && m.hg!==null && m.ag!==null && m.hg!=='' && m.ag!==''){
        const hg = parseInt(m.hg)||0, ag = parseInt(m.ag)||0;
        goals[m.home] = (goals[m.home]||0) + hg;
        goals[m.away] = (goals[m.away]||0) + ag;
        conceded[m.home] = (conceded[m.home]||0) + ag;
        conceded[m.away] = (conceded[m.away]||0) + hg;
      }
    });
  }

  const k = state.knockout || {};
  const addTieStats = (tie)=>{
    if(!tie) return;
    if(tie.legs && Array.isArray(tie.legs)){
      tie.legs.forEach(l=>{
        if(l && l.hg!==null && l.ag!==null && l.hg!=='' && l.ag!==''){
          const hg = parseInt(l.hg)||0, ag = parseInt(l.ag)||0;
          goals[tie.home] = (goals[tie.home]||0) + hg;
          goals[tie.away] = (goals[tie.away]||0) + ag;
          conceded[tie.home] = (conceded[tie.home]||0) + ag;
          conceded[tie.away] = (conceded[tie.away]||0) + hg;
        }
      });
    }
    if(tie.tiebreak && tie.tiebreak.hg!==null && tie.tiebreak.ag!==null && tie.tiebreak.hg!=='' && tie.tiebreak.ag!==''){
      const hg = parseInt(tie.tiebreak.hg)||0, ag = parseInt(tie.tiebreak.ag)||0;
      goals[tie.home] = (goals[tie.home]||0) + hg;
      goals[tie.away] = (goals[tie.away]||0) + ag;
      conceded[tie.home] = (conceded[tie.home]||0) + ag;
      conceded[tie.away] = (conceded[tie.away]||0) + hg;
    }
  };

  const addSingleStats = (m)=>{
    if(!m || !m.match) return;
    const mm = m.match;
    if(mm && mm.hg!==null && mm.ag!==null && mm.hg!=='' && mm.ag!==''){
      const hg = parseInt(mm.hg)||0, ag = parseInt(mm.ag)||0;
      goals[m.home] = (goals[m.home]||0) + hg;
      goals[m.away] = (goals[m.away]||0) + ag;
      conceded[m.home] = (conceded[m.home]||0) + ag;
      conceded[m.away] = (conceded[m.away]||0) + hg;
    }
  };

  if(k.qf && Array.isArray(k.qf)) k.qf.forEach(addTieStats);
  if(k.sf && Array.isArray(k.sf)) k.sf.forEach(addTieStats);
  addSingleStats(k.final);
  addSingleStats(k.thirdPlace);

  const goalsArr = Object.entries(goals).map(([team,val])=>({team,val})).sort((a,b)=>b.val-a.val || a.team.localeCompare(b.team));
  const concededArr = Object.entries(conceded).map(([team,val])=>({team,val})).sort((a,b)=>a.val-b.val || a.team.localeCompare(b.team));
  return {goalsArr, concededArr};
}

// RÈGLE STRICTE DES QUARTS : 1er vs 2ème de groupes différents
function generateQF(){
  const stand = {};
  ['A','B','C','D'].forEach(k=> {
    const s = computeStandings(k);
    stand[k] = [
      (s[0] && s[0].team) ? s[0].team : `1er Groupe ${k}`,
      (s[1] && s[1].team) ? s[1].team : `2e Groupe ${k}`
    ];
  });

  const makeTie = (id, home, away)=>({
    id, 
    round:'QF', 
    home: home || '?', 
    away: away || '?', 
    legs:[emptyStat(),emptyStat()], 
    tiebreak:emptyStat(), 
    manualWinner:null, 
    winner:null
  });

  if(!state.knockout) state.knockout = {};
  
  // A1 vs B2, B1 vs A2, C1 vs D2, D1 vs C2
  state.knockout.qf = [
    makeTie('qf1', stand.A[0], stand.B[1]), // 1er A vs 2e B
    makeTie('qf2', stand.B[0], stand.A[1]), // 1er B vs 2e A
    makeTie('qf3', stand.C[0], stand.D[1]), // 1er C vs 2e D
    makeTie('qf4', stand.D[0], stand.C[1]), // 1er D vs 2e C
  ];
  state.knockout.sf = null;
  state.knockout.final = null;
  state.knockout.thirdPlace = null;
}

function generateSF(){
  const qf = state.knockout.qf;
  const makeTie = (id,home,away)=>({id, round:'SF', home: home||'?', away: away||'?', legs:[emptyStat(),emptyStat()], tiebreak:emptyStat(), manualWinner:null, winner:null});
  state.knockout.sf = [
    makeTie('sf1', qf[0].winner, qf[1].winner),
    makeTie('sf2', qf[2].winner, qf[3].winner),
  ];
  state.knockout.final = null;
  state.knockout.thirdPlace = null;
}

function generateFinals(){
  const sf = state.knockout.sf;
  const sf1Loser = sf[0].winner===sf[0].home ? sf[0].away : sf[0].home;
  const sf2Loser = sf[1].winner===sf[1].home ? sf[1].away : sf[1].home;
  state.knockout.final = {id:'final', round:'F', home:sf[0].winner||'?', away:sf[1].winner||'?', match:emptyStat(), manualWinner:null, winner:null};
  state.knockout.thirdPlace = {id:'3rd', round:'3P', home:sf1Loser||'?', away:sf2Loser||'?', match:emptyStat(), manualWinner:null, winner:null};
}

function tieAggregate(tie){
  const l1 = tie.legs[0], l2 = tie.legs[1];
  if(l1.hg===null||l1.ag===null||l2.hg===null||l2.ag===null||l1.hg===''||l1.ag===''||l2.hg===''||l2.ag==='') return null;
  const homeAgg = parseInt(l1.hg) + parseInt(l2.ag);
  const awayAgg = parseInt(l1.ag) + parseInt(l2.hg);
  return {homeAgg, awayAgg};
}

function evaluateTieWinner(tie){
  if(tie.manualWinner){ tie.winner = tie.manualWinner; return; }
  const agg = tieAggregate(tie);
  if(!agg){ tie.winner = null; return; }
  if(agg.homeAgg > agg.awayAgg){ tie.winner = tie.home; return; }
  if(agg.homeAgg < agg.awayAgg){ tie.winner = tie.away; return; }
  const tb = tie.tiebreak;
  if(tb && tb.hg!==null && tb.ag!==null && tb.hg!=='' && tb.ag!==''){
    if(parseInt(tb.hg) > parseInt(tb.ag)){ tie.winner = tie.home; return; }
    if(parseInt(tb.hg) < parseInt(tb.ag)){ tie.winner = tie.away; return; }
  }
  tie.winner = null;
}

function evaluateSingleMatch(m){
  if(!m) return;
  if(m.manualWinner){ m.winner = m.manualWinner; return; }
  if(!m.match || m.match.hg===null || m.match.ag===null || m.match.hg==='' || m.match.ag===''){ m.winner = null; return; }
  if(parseInt(m.match.hg) > parseInt(m.match.ag)){ m.winner = m.home; return; }
  if(parseInt(m.match.hg) < parseInt(m.match.ag)){ m.winner = m.away; return; }
  m.winner = null;
}

// ---------- RENDERING ----------

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function render(){
  if(!state) return;
  document.getElementById('updatedAt').textContent = 'Dernière mise à jour : ' + fmtDate(state.updatedAt);
  document.getElementById('adminBtn').textContent = isAdmin ? '🔓 Admin actif' : '🔒 Mode admin';
  document.getElementById('adminBtn').className = 'admin-btn' + (isAdmin?' on':'');
  const main = document.getElementById('main');
  if(currentTab==='groupes') main.innerHTML = renderGroupes();
  if(currentTab==='classement') main.innerHTML = renderClassement();
  if(currentTab==='calendrier') main.innerHTML = renderCalendrier();
  if(currentTab==='finale') main.innerHTML = renderFinale();
  if(currentTab==='palmares') main.innerHTML = renderPalmares();
  if(currentTab==='regles') main.innerHTML = renderRegles();
  attachHandlers();
}

function renderGroupes(){
  const g = state.groups || {};
  const box = (key)=>`
    <div class="group-box">
      <h3><span class="gdot" style="background:${GROUP_COLOR[key]}"></span>Groupe ${key}</h3>
      <ul>${(g[key]||[]).map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>`;
  return `<div class="card">
    <h2>Tirage au sort</h2>
    <div class="groups-grid">${box('A')}${box('B')}${box('C')}${box('D')}</div>
  </div>`;
}

function standingsTable(groupKey){
  const rows = computeStandings(groupKey);
  return `<table>
    <thead><tr>
      <th class="team-name">Équipe</th><th>J</th><th>V</th><th>N</th><th>D</th><th>BP</th><th>BC</th><th>Diff</th><th>Pts</th>
    </tr></thead>
    <tbody>
      ${rows.map((r,i)=>`<tr class="${i<2?'qualified':''}">
        <td class="team-name">${r.team}</td>
        <td>${r.j}</td><td>${r.v}</td><td>${r.n}</td><td>${r.d}</td>
        <td>${r.bp}</td><td>${r.bc}</td><td>${r.diff>0?'+':''}${r.diff}</td>
        <td class="mono">${r.pts}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}
